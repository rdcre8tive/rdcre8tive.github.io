<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Digital Sign Messaging</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            margin: 0;
            background: black;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            gap: 20px;
        }
        .column {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .preview-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.3s;
            margin: 0;
            padding: 0;
        }
        .preview-box h1 {
            width: 50%;
            margin: 0;
            font-size: 48px;
            text-align: center;
        }
        .deck {
            width: 80%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 250px;
            position: relative;
            transition: 0.3s;
        }
        .card.live {
            border: 3px solid green;
        }
        .card .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            color: red;
            font-size: 16px;
            cursor: pointer;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: darkblue;
        }
        @media screen and (max-width: 768px) {
            .preview-box h1 {
                font-size: 32px;
            }
        }

        .content-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: black;
            margin-top: 40px;
        }
        h3 {
            color: white;
        }
        .column h3 {
            color: black;
        }
    </style>
</head>
<body>

    <!-- Live Display Preview -->
    <div class="preview-box" id="livePreview">
        <h1>Live Message Preview</h1>
    </div>

    <div class="content-wrapper">
        <!-- Deck Area for Cards -->
        <h3>Deck (Queued Messages)</h3>
        <div id="deck" class="deck"></div>

        <div class="container">
            <!-- Editable Names Column -->
            <div class="column">
                <h3>Select or Edit Names</h3>
                <input type="text" id="newName" placeholder="Enter first name">
                <button id="addName">Add Name</button>
                <div id="nameList"></div>
            </div>

            <!-- Editable Messages Column -->
            <div class="column">
                <h3>Select or Edit Messages</h3>
                <input type="text" id="newMessage" placeholder="Enter new message">
                <button id="addMessage">Add Message</button>
                <div id="messageList"></div>
            </div>

            <!-- Preview Column -->
            <div class="column">
                <h3>Message Preview</h3>
                <p id="messagePreview">[Select a name and message]</p>
                <button id="pushToDeckButton">Push to Deck</button>
            </div>
        </div>
    </div>

    <script>
        const nameList = document.getElementById('nameList');
        const messageList = document.getElementById('messageList');
        const deck = document.getElementById('deck');
        const newNameInput = document.getElementById('newName');
        const newMessageInput = document.getElementById('newMessage');
        const addNameButton = document.getElementById('addName');
        const addMessageButton = document.getElementById('addMessage');
        const messagePreview = document.getElementById('messagePreview');
        const livePreview = document.getElementById('livePreview');
        const pushToDeckButton = document.getElementById('pushToDeckButton');

        let activeLiveCard = null;
        // Use a more secure way to handle the token
        const getGitHubToken = () => {
            // In production, this should be handled more securely
            return localStorage.getItem('github_token') || '';
        };

        const GITHUB_REPO = 'rdcre8tive/rdcre8tive.github.io';
        const UPDATE_INTERVAL = 5000;

        // Function to update content on GitHub
        async function updateGitHub(content) {
            const token = getGitHubToken();
            if (!token) {
                // Fallback to local storage if no token
                localStorage.setItem('live_message', JSON.stringify({
                    content: content,
                    timestamp: Date.now()
                }));
                return;
            }

            try {
                // First, get the current file to get its SHA
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/live-message.json`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                const fileData = {
                    message: 'Update live message',
                    content: btoa(JSON.stringify({
                        content: content,
                        timestamp: Date.now()
                    })),
                };

                if (response.ok) {
                    const data = await response.json();
                    fileData.sha = data.sha;
                }

                // Update or create the file
                await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/live-message.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(fileData)
                });
            } catch (error) {
                console.error('Failed to update GitHub:', error);
                // Fallback to local storage
                localStorage.setItem('live_message', JSON.stringify({
                    content: content,
                    timestamp: Date.now()
                }));
            }
        }

        // Function to check for updates
        async function checkForUpdates() {
            try {
                // Try GitHub first
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/live-message.json?t=${Date.now()}`, {
                    cache: 'no-store'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (livePreview.querySelector('h1').textContent !== data.content) {
                        livePreview.querySelector('h1').textContent = data.content;
                    }
                } else {
                    // Fallback to local storage
                    const localData = localStorage.getItem('live_message');
                    if (localData) {
                        const data = JSON.parse(localData);
                        if (livePreview.querySelector('h1').textContent !== data.content) {
                            livePreview.querySelector('h1').textContent = data.content;
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to check for updates:', error);
                // Try local storage as fallback
                const localData = localStorage.getItem('live_message');
                if (localData) {
                    const data = JSON.parse(localData);
                    if (livePreview.querySelector('h1').textContent !== data.content) {
                        livePreview.querySelector('h1').textContent = data.content;
                    }
                }
            }
        }

        // Check if this is an embedded view
        const isEmbedded = window.location.search.includes('embedded=true');

        if (isEmbedded) {
            // For embedded views, only show the preview box and check for updates
            document.querySelector('.content-wrapper').style.display = 'none';
            
            // Check for updates periodically
            setInterval(checkForUpdates, UPDATE_INTERVAL);
        }

        function updatePreview() {
            const selectedName = document.querySelector('input[name="selectedName"]:checked + span');
            const selectedMessage = document.querySelector('input[name="selectedMessage"]:checked + span');
            
            if (selectedMessage) {
                const nameText = selectedName ? (selectedName.textContent === "[None]" ? "" : selectedName.textContent + ": ") : "";
                const messageText = `${nameText}${selectedMessage.textContent}`;
                messagePreview.textContent = messageText;
                livePreview.querySelector('h1').textContent = messageText;
                updateGitHub(messageText);
            } else {
                messagePreview.textContent = '[Select a message]';
                const defaultMessage = messageList.querySelector('.message-item:first-child span');
                const previewText = defaultMessage ? defaultMessage.textContent : 'Live Message Preview';
                livePreview.querySelector('h1').textContent = previewText;
                updateGitHub(previewText);
            }
        }

        function pushToDeck() {
            if (messagePreview.textContent !== '[Select a name and message]') {
                saveToDeck(messagePreview.textContent);
            }
        }

        function saveToDeck(text) {
            // Check if already exists
            let existingCard = Array.from(deck.children).find(card => card.textContent.includes(text));
            if (!existingCard) {
                const card = document.createElement('div');
                card.classList.add('card');
                card.textContent = text;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✖';
                deleteBtn.classList.add('close-btn');
                deleteBtn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    deck.removeChild(card);
                    if (card === activeLiveCard) {
                        livePreview.querySelector('h1').textContent = "Live Message Preview";
                        livePreview.classList.remove('live');
                        activeLiveCard = null;
                    }
                });

                // Clicking the card makes it live
                card.addEventListener('click', () => {
                    if (activeLiveCard) {
                        activeLiveCard.classList.remove('live');
                    }
                    card.classList.add('live');
                    activeLiveCard = card;
                    livePreview.querySelector('h1').textContent = text;
                    livePreview.classList.add('live');
                    updateGitHub(text);
                });

                card.appendChild(deleteBtn);
                deck.appendChild(card);
            }
        }

        function addToList(parent, text, type) {
            const div = document.createElement('div');
            div.classList.add(type === 'name' ? 'name-item' : 'message-item');

            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = type === 'name' ? 'selectedName' : 'selectedMessage';
            radio.addEventListener('change', updatePreview);

            const span = document.createElement('span');
            span.textContent = text;

            div.appendChild(radio);
            div.appendChild(span);
            parent.appendChild(div);
            return div;
        }

        // Preload Names for Testing
        function preloadNames() {
            addToList(nameList, "[None]", "name");
            addToList(nameList, "Bryan", "name");
            addToList(nameList, "Drew", "name");
        }

        // Preload Generic Messages
        function preloadMessages() {
            // Add default message first and select it
            const defaultDiv = addToList(messageList, "Welcome", "message");
            defaultDiv.querySelector('input[type="radio"]').checked = true;
            
            addToList(messageList, "Please check in at the front desk", "message");
            addToList(messageList, "Thank you for visiting", "message");
        }

        addNameButton.addEventListener('click', () => {
            if (newNameInput.value.trim()) {
                addToList(nameList, newNameInput.value.trim(), 'name');
                newNameInput.value = '';
            }
        });

        addMessageButton.addEventListener('click', () => {
            if (newMessageInput.value.trim()) {
                addToList(messageList, newMessageInput.value.trim(), 'message');
                newMessageInput.value = '';
            }
        });

        pushToDeckButton.addEventListener('click', pushToDeck);

        // Load Test Data
        preloadNames();
        preloadMessages();
        
        // Initialize preview with default message
        updatePreview();

        // Add token setup UI for admin
        if (!isEmbedded) {
            const tokenContainer = document.createElement('div');
            tokenContainer.style.cssText = 'position: fixed; top: 10px; right: 10px; padding: 10px; background: rgba(0,0,0,0.8); border-radius: 5px; z-index: 1000;';
            
            const label = document.createElement('label');
            label.textContent = 'GitHub Token: ';
            label.style.cssText = 'color: white; margin-right: 10px; font-size: 14px;';
            
            const tokenInput = document.createElement('input');
            tokenInput.type = 'password';
            tokenInput.placeholder = 'Enter GitHub token';
            tokenInput.value = getGitHubToken();
            tokenInput.style.cssText = 'padding: 5px; width: 200px; margin-right: 10px;';
            
            const saveButton = document.createElement('button');
            saveButton.textContent = 'Save Token';
            saveButton.style.cssText = 'padding: 5px 10px; background: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer;';
            
            saveButton.addEventListener('click', () => {
                localStorage.setItem('github_token', tokenInput.value);
                alert('Token saved! GitHub sync is now enabled.');
            });
            
            tokenContainer.appendChild(label);
            tokenContainer.appendChild(tokenInput);
            tokenContainer.appendChild(saveButton);
            document.body.appendChild(tokenContainer);
        }

    </script>

</body>
</html>
