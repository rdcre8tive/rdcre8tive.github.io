<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Digital Sign Messaging</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            margin: 0;
            background: black;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            gap: 20px;
        }
        .column {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .preview-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.3s;
            margin: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
        }
        .preview-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90%;
            height: 90%;
            background-image: url('assets/rings.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.7;
            transform: translate(-50%, -50%);
            animation: rotateRings 35s linear infinite;
            z-index: 1;
            transition: all 1.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .preview-box h1 {
            width: 80%;
            margin: 0;
            font-size: 48px;
            text-align: center;
            line-height: 1.3;
            opacity: 1;
            transform: scale(1);
            transition: opacity 1.5s cubic-bezier(0.165, 0.84, 0.44, 1),
                        transform 1.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            z-index: 2;
        }
        @keyframes rotateRings {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        .preview-box.transitioning h1 {
            opacity: 0;
            transform: scale(0.6);
        }
        .preview-box.transitioning::before {
            opacity: 0.5;
            width: 76.5%;  /* 90% * 0.85 = 76.5% - this creates the scale effect */
            height: 76.5%;
        }
        .deck {
            width: 80%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 250px;
            position: relative;
            transition: 0.3s;
            min-height: 60px;
            line-height: 1.3;
        }
        .card.live {
            border: 3px solid green;
        }
        .card .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            color: red;
            font-size: 16px;
            cursor: pointer;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: darkblue;
        }
        @media screen and (max-width: 768px) {
            .preview-box h1 {
                font-size: 32px;
            }
        }

        .content-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: black;
            margin-top: 40px;
        }
        h3 {
            color: white;
        }
        .column h3 {
            color: black;
        }
        #messagePreview {
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <!-- Live Display Preview -->
    <div class="preview-box" id="livePreview">
        <h1>Welcome</h1>
    </div>

    <div class="content-wrapper">
        <!-- Deck Area for Cards -->
        <h3>Deck (Queued Messages)</h3>
        <div id="deck" class="deck"></div>

        <div class="container">
            <!-- Editable Names Column -->
            <div class="column">
                <h3>Select or Edit Names</h3>
                <input type="text" id="newName" placeholder="Enter first name">
                <button id="addName">Add Name</button>
                <div id="nameList"></div>
            </div>

            <!-- Editable Messages Column -->
            <div class="column">
                <h3>Select or Edit Messages</h3>
                <input type="text" id="newMessage" placeholder="Enter new message">
                <button id="addMessage">Add Message</button>
                <div id="messageList"></div>
            </div>

            <!-- Preview Column -->
            <div class="column">
                <h3>Message Preview</h3>
                <p id="messagePreview">[Select a name and message]</p>
                <button id="pushToDeckButton">Push to Deck</button>
            </div>
        </div>
    </div>

    <script>
        const nameList = document.getElementById('nameList');
        const messageList = document.getElementById('messageList');
        const deck = document.getElementById('deck');
        const newNameInput = document.getElementById('newName');
        const newMessageInput = document.getElementById('newMessage');
        const addNameButton = document.getElementById('addName');
        const addMessageButton = document.getElementById('addMessage');
        const messagePreview = document.getElementById('messagePreview');
        const livePreview = document.getElementById('livePreview');
        const pushToDeckButton = document.getElementById('pushToDeckButton');

        let activeLiveCard = null;

        // Check if this is an embedded view
        const isEmbedded = window.location.search.includes('embedded=true');

        if (isEmbedded) {
            // For embedded views, only show the preview box
            document.querySelector('.content-wrapper').style.display = 'none';
        }

        function toTitleCase(str) {
            return str.replace(/\w\S*/g, function(txt) {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            });
        }

        function formatMessage(name, message) {
            if (!message) return '';
            message = toTitleCase(message);
            
            if (name && name !== "[None]") {
                name = toTitleCase(name);
                return `${name},\n${message}`;
            }
            return message;
        }

        function updatePreview() {
            const selectedName = document.querySelector('input[name="selectedName"]:checked + span');
            const selectedMessage = document.querySelector('input[name="selectedMessage"]:checked + span');
            
            if (selectedMessage) {
                const nameText = selectedName ? selectedName.textContent : "";
                const messageText = selectedMessage.textContent;
                messagePreview.innerHTML = formatMessage(nameText, messageText).replace('\n', '<br>');
            } else {
                messagePreview.textContent = '[Select a message]';
            }
        }

        function updateLivePreview(text) {
            const h1 = livePreview.querySelector('h1');
            const rings = livePreview.querySelector('::before');
            
            // Calculate current rotation
            const currentRotation = (Date.now() / 35000) * 360 % 360;
            livePreview.style.setProperty('--rotation', `${currentRotation}deg`);
            
            livePreview.classList.add('transitioning');
            
            // Wait for fade out (1.5 seconds to match transition)
            setTimeout(() => {
                // Update content
                h1.innerHTML = text.replace('\n', '<br>');
                // Trigger reflow
                h1.offsetHeight;
                // Fade in
                livePreview.classList.remove('transitioning');
            }, 1500);
        }

        function saveToDeck(text) {
            // Check if already exists
            let existingCard = Array.from(deck.children).find(card => card.textContent.includes(text));
            if (!existingCard) {
                const card = document.createElement('div');
                card.classList.add('card');
                // Use white-space: pre-line to preserve line breaks
                card.style.whiteSpace = 'pre-line';
                card.textContent = text;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✖';
                deleteBtn.classList.add('close-btn');
                deleteBtn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    deck.removeChild(card);
                    if (card === activeLiveCard) {
                        resetToWelcome();
                    }
                });

                card.addEventListener('click', () => {
                    if (activeLiveCard) {
                        activeLiveCard.classList.remove('live');
                    }
                    card.classList.add('live');
                    activeLiveCard = card;
                    // Use the new transition function
                    updateLivePreview(text);
                    livePreview.classList.add('live');
                });

                card.appendChild(deleteBtn);
                deck.appendChild(card);
            }
        }

        function pushToDeck() {
            if (messagePreview.textContent !== '[Select a name and message]' && messagePreview.textContent !== '[Select a message]') {
                const selectedName = document.querySelector('input[name="selectedName"]:checked + span');
                const selectedMessage = document.querySelector('input[name="selectedMessage"]:checked + span');
                const formattedText = formatMessage(
                    selectedName ? selectedName.textContent : null,
                    selectedMessage ? selectedMessage.textContent : null
                );
                saveToDeck(formattedText);
            }
        }

        function resetToWelcome() {
            if (activeLiveCard) {
                activeLiveCard.classList.remove('live');
            }
            activeLiveCard = null;
            updateLivePreview("Welcome");
            livePreview.classList.remove('live');
        }

        function addToList(parent, text, type) {
            const div = document.createElement('div');
            div.classList.add(type === 'name' ? 'name-item' : 'message-item');

            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = type === 'name' ? 'selectedName' : 'selectedMessage';
            radio.addEventListener('change', updatePreview);

            const span = document.createElement('span');
            span.textContent = text;

            div.appendChild(radio);
            div.appendChild(span);
            parent.appendChild(div);
            return div;
        }

        // Preload Names for Testing
        function preloadNames() {
            addToList(nameList, "[None]", "name");
            addToList(nameList, "Bryan", "name");
            addToList(nameList, "Drew", "name");
        }

        // Preload Generic Messages
        function preloadMessages() {
            // Add messages without triggering preview updates
            const defaultDiv = addToList(messageList, "Welcome", "message");
            const defaultRadio = defaultDiv.querySelector('input[type="radio"]');
            
            // Remove the change event listener temporarily
            defaultRadio.removeEventListener('change', updatePreview);
            // Check the radio button
            defaultRadio.checked = true;
            // Add the event listener back
            defaultRadio.addEventListener('change', updatePreview);
            
            addToList(messageList, "Please check in at the front desk", "message");
            addToList(messageList, "Thank you for visiting", "message");
            
            // Set the initial message preview without affecting live preview
            messagePreview.textContent = "Welcome";
        }

        addNameButton.addEventListener('click', () => {
            if (newNameInput.value.trim()) {
                addToList(nameList, newNameInput.value.trim(), 'name');
                newNameInput.value = '';
            }
        });

        addMessageButton.addEventListener('click', () => {
            if (newMessageInput.value.trim()) {
                addToList(messageList, newMessageInput.value.trim(), 'message');
                newMessageInput.value = '';
            }
        });

        pushToDeckButton.addEventListener('click', pushToDeck);

        // Load Test Data
        preloadNames();
        preloadMessages();
        
        // Initialize preview with "Welcome" and reset any active cards
        resetToWelcome();

    </script>

</body>
</html>
