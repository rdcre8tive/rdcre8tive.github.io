<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Sign Display</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .preview-box {
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .preview-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90%;
            height: 90%;
            background-image: url('assets/rings.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.7;
            transform: translate(-50%, -50%);
            animation: rotateRings 35s linear infinite;
            z-index: 1;
            transition: all 1.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .preview-box h1 {
            width: 80%;
            margin: 0;
            font-size: 72px;
            text-align: center;
            line-height: 1.3;
            opacity: 1;
            transform: scale(1);
            transition: opacity 1.5s cubic-bezier(0.165, 0.84, 0.44, 1),
                        transform 1.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            z-index: 2;
            font-family: Arial, sans-serif;
        }
        @keyframes rotateRings {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        .preview-box.transitioning h1 {
            opacity: 0;
            transform: scale(0.6);
        }
        .preview-box.transitioning::before {
            opacity: 0.5;
            width: 76.5%;
            height: 76.5%;
        }
    </style>
</head>
<body>
    <div class="preview-box" id="livePreview">
        <h1>Welcome</h1>
    </div>

    <script>
        const livePreview = document.getElementById('livePreview');
        const channel = new BroadcastChannel('digital_signage');

        function updateLivePreview(text) {
            const h1 = livePreview.querySelector('h1');
            
            // Calculate current rotation
            const currentRotation = (Date.now() / 35000) * 360 % 360;
            livePreview.style.setProperty('--rotation', `${currentRotation}deg`);
            
            livePreview.classList.add('transitioning');
            
            setTimeout(() => {
                h1.innerHTML = text.replace('\n', '<br>');
                h1.offsetHeight;
                livePreview.classList.remove('transitioning');
            }, 1500);
        }

        // Listen for messages from the control panel
        channel.onmessage = (event) => {
            if (event.data.type === 'updateDisplay') {
                updateLivePreview(event.data.text);
            }
        };
    </script>
</body>
</html>
